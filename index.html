<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <!-- Esta línea hace que la página se ajuste al ancho del celular -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lista de tareas</title>

  <style>
    /* Único estilo por ahora: las tareas completadas se ven tachadas */
    .completada {
      text-decoration: line-through;
    }
  </style>
</head>
<body>

  <!-- ESTRUCTURA: lo que se ve en la página -->
  <h1>Mi lista de tareas</h1>

  <input type="text" id="campoTarea" placeholder="Escribe una tarea">
  <button id="botonAgregar">Agregar</button>

  <ul id="listaTareas"></ul>

  <!-- Ventana de confirmación: está oculta hasta que se necesita -->
  <dialog id="ventanaConfirmar">
    <p>Confirma borrar tarea no completada?</p>
    <button id="botonConfirmar">Confirmar</button>
    <button id="botonCancelar">Cancelar</button>
  </dialog>

  <script>
    // 1. Conectar el código con los elementos de la página
    const campoTarea = document.getElementById("campoTarea");
    const botonAgregar = document.getElementById("botonAgregar");
    const listaTareas = document.getElementById("listaTareas");
    const ventanaConfirmar = document.getElementById("ventanaConfirmar");
    const botonConfirmar = document.getElementById("botonConfirmar");
    const botonCancelar = document.getElementById("botonCancelar");

    // 2. GUARDADO: nombre del "cajón" del navegador donde guardamos las tareas
    const CLAVE = "lista-de-tareas";

    // Cargar las tareas guardadas (si no hay nada guardado, empezamos con una lista vacía)
    function cargarTareas() {
      try {
        const textoGuardado = localStorage.getItem(CLAVE);
        if (textoGuardado) {
          const datos = JSON.parse(textoGuardado); // convierte el texto en lista
          if (Array.isArray(datos)) {
            return datos;
          }
        }
      } catch (error) {
        // Si algo falla (datos dañados o navegador sin permiso), empezamos de cero
      }
      return [];
    }

    // Guardar la lista actual en el navegador
    function guardarTareas() {
      try {
        localStorage.setItem(CLAVE, JSON.stringify(tareas)); // convierte la lista en texto
      } catch (error) {
        // Si no se puede guardar, la app sigue funcionando, pero sin guardado
      }
    }

    // 3. La lista de tareas vive aquí, en memoria.
    //    Cada tarea es un objeto: { id: 123, texto: "Comprar pan", completada: false }
    let tareas = cargarTareas();

    // Recuerda qué tarea se quiere borrar mientras la ventana está abierta
    let tareaPendienteId = null;

    // 4. Dibujar en la página todas las tareas de la lista
    function mostrarTareas() {
      listaTareas.innerHTML = ""; // vaciar lo que se veía antes

      tareas.forEach(function (tarea) {
        const item = document.createElement("li");

        const casilla = document.createElement("input");
        casilla.type = "checkbox";
        casilla.checked = tarea.completada;

        const etiqueta = document.createElement("span");
        etiqueta.textContent = tarea.texto;
        etiqueta.classList.toggle("completada", tarea.completada);

        const botonBorrar = document.createElement("button");
        botonBorrar.textContent = "Borrar";

        // Al marcar o desmarcar: se tacha el texto y SE GUARDA
        casilla.addEventListener("change", function () {
          tarea.completada = casilla.checked;
          etiqueta.classList.toggle("completada", tarea.completada);
          guardarTareas();
        });

        // Al presionar "Borrar":
        //  - completada: se borra directamente
        //  - no completada: se pide confirmación
        botonBorrar.addEventListener("click", function () {
          if (tarea.completada) {
            borrarTarea(tarea.id);
          } else {
            tareaPendienteId = tarea.id;
            ventanaConfirmar.showModal();
          }
        });

        item.appendChild(casilla);
        item.appendChild(etiqueta);
        item.appendChild(botonBorrar);
        listaTareas.appendChild(item);
      });
    }

    // 5. Agregar una tarea nueva: se suma a la lista, SE GUARDA y se redibuja
    function agregarTarea() {
      const texto = campoTarea.value.trim();

      if (texto === "") {
        return;
      }

      tareas.push({
        id: Date.now(), // un número único basado en la hora actual
        texto: texto,
        completada: false
      });

      guardarTareas();
      mostrarTareas();

      campoTarea.value = "";
      campoTarea.focus();
    }

    // 6. Borrar una tarea: se quita de la lista, SE GUARDA y se redibuja
    function borrarTarea(id) {
      tareas = tareas.filter(function (tarea) {
        return tarea.id !== id; // nos quedamos con todas menos la borrada
      });
      guardarTareas();
      mostrarTareas();
    }

    // Botón "Confirmar": borra la tarea pendiente y cierra la ventana
    botonConfirmar.addEventListener("click", function () {
      if (tareaPendienteId !== null) {
        borrarTarea(tareaPendienteId);
      }
      ventanaConfirmar.close();
    });

    // Botón "Cancelar": solo cierra la ventana
    botonCancelar.addEventListener("click", function () {
      ventanaConfirmar.close();
    });

    // Al cerrarse la ventana (por cualquier motivo, incluida la tecla Esc),
    // se olvida la tarea pendiente
    ventanaConfirmar.addEventListener("close", function () {
      tareaPendienteId = null;
    });

    // Agregar con el botón y con la tecla Enter
    botonAgregar.addEventListener("click", agregarTarea);

    campoTarea.addEventListener("keydown", function (evento) {
      if (evento.key === "Enter") {
        agregarTarea();
      }
    });

    // 7. Al abrir la página, mostrar las tareas que se cargaron
    mostrarTareas();
  </script>

</body>
</html>
