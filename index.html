<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <!-- Esta línea hace que la página se ajuste al ancho del celular -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Lista de tareas</title>

  <style>
    /* Fondo de la aplicación: degradado suave */
    body {
      margin: 0;
      min-height: 100vh;
      padding: 24px 16px;
      box-sizing: border-box;
      background: linear-gradient(135deg, #e0e7ff 0%, #f3e8ff 100%);
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      color: #1f2937;
    }

    /* Contenedor principal: centrado y con ancho máximo */
    .contenedor {
      max-width: 500px;
      margin: 0 auto;
      background: #ffffff;
      padding: 28px 24px;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(79, 70, 229, 0.15);
    }

    /* Barra superior con el botón de tema */
    .barra-tema {
      display: flex;
      justify-content: flex-end;
      margin-bottom: 8px;
    }

    #botonTema {
      width: 40px;
      height: 40px;
      font-size: 1.2rem;
      line-height: 1;
      background: #eef2ff;
      border: 1px solid #c7d2fe;
      border-radius: 50%;
      cursor: pointer;
      transition: background-color 0.25s ease, transform 0.15s ease, box-shadow 0.25s ease;
    }

    #botonTema:hover {
      background: #e0e7ff;
      transform: translateY(-2px);
      box-shadow: 0 4px 10px rgba(79, 70, 229, 0.2);
    }

    #botonTema:active {
      transform: translateY(0);
    }

    /* Título de la aplicación */
    h1 {
      text-align: center;
      margin: 0 0 24px;
      font-size: 2rem;
      font-weight: 800;
      letter-spacing: 0.5px;
      background: linear-gradient(90deg, #4f46e5, #9333ea);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      color: #4f46e5; /* respaldo si el navegador no soporta el degradado */
    }

    /* Fila para escribir y agregar tareas */
    .fila-agregar {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 20px;
    }

    #campoTarea {
      flex: 1 1 100%;
      min-width: 160px;
      padding: 10px 12px;
      font-size: 1rem;
      border: 2px solid #e5e7eb;
      border-radius: 8px;
      outline: none;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    #campoTarea:focus {
      border-color: #4f46e5;
      box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.15);
    }

    /* Selector de fecha opcional */
    #campoFecha {
      flex: 1;
      padding: 9px 10px;
      font-size: 0.9rem;
      font-family: inherit;
      color: #374151;
      border: 2px solid #e5e7eb;
      border-radius: 8px;
      outline: none;
      background: #ffffff;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    #campoFecha:focus {
      border-color: #4f46e5;
      box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.15);
    }

    /* Selector de prioridad */
    #campoPrioridad {
      padding: 9px 10px;
      font-size: 0.9rem;
      font-family: inherit;
      font-weight: 600;
      color: #374151;
      border: 2px solid #e5e7eb;
      border-radius: 8px;
      outline: none;
      background: #ffffff;
      cursor: pointer;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    #campoPrioridad:focus {
      border-color: #4f46e5;
      box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.15);
    }

    /* Botón Agregar */
    #botonAgregar {
      padding: 10px 18px;
      font-size: 1rem;
      font-weight: 600;
      color: #ffffff;
      background: #4f46e5;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background-color 0.25s ease, transform 0.15s ease, box-shadow 0.25s ease;
    }

    #botonAgregar:hover {
      background: #4338ca;
      transform: translateY(-2px);
      box-shadow: 0 4px 10px rgba(79, 70, 229, 0.35);
    }

    #botonAgregar:active {
      transform: translateY(0);
    }

    /* Fila para buscar tareas */
    .fila-buscar {
      display: flex;
      gap: 8px;
      margin-bottom: 12px;
    }

    #campoBuscar {
      flex: 1;
      min-width: 0;
      padding: 9px 12px;
      font-size: 0.95rem;
      border: 2px solid #e5e7eb;
      border-radius: 8px;
      outline: none;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    #campoBuscar:focus {
      border-color: #9333ea;
      box-shadow: 0 0 0 3px rgba(147, 51, 234, 0.15);
    }

    #botonLimpiar {
      padding: 9px 14px;
      font-size: 0.9rem;
      font-weight: 600;
      color: #374151;
      background: #e5e7eb;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background-color 0.25s ease, transform 0.15s ease, box-shadow 0.25s ease;
    }

    #botonLimpiar:hover {
      background: #d1d5db;
      transform: translateY(-2px);
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.12);
    }

    #botonLimpiar:active {
      transform: translateY(0);
    }

    /* Botones de filtro */
    .filtros {
      display: flex;
      gap: 8px;
      margin-bottom: 12px;
    }

    .filtros button {
      flex: 1;
      padding: 8px 10px;
      font-size: 0.9rem;
      font-weight: 600;
      color: #4f46e5;
      background: #eef2ff;
      border: 2px solid transparent;
      border-radius: 8px;
      cursor: pointer;
      transition: background-color 0.25s ease, color 0.25s ease, transform 0.15s ease, box-shadow 0.25s ease;
    }

    .filtros button:hover {
      background: #e0e7ff;
      transform: translateY(-2px);
      box-shadow: 0 4px 10px rgba(79, 70, 229, 0.2);
    }

    .filtros button:active {
      transform: translateY(0);
    }

    /* Botón de filtro activo: resaltado con otro color */
    .filtros button.activo {
      color: #ffffff;
      background: #9333ea;
      box-shadow: 0 4px 10px rgba(147, 51, 234, 0.35);
    }

    .filtros button.activo:hover {
      background: #7e22ce;
    }

    /* Barra de contador + botón de organizar */
    .barra-estado {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 16px;
    }

    /* Contador de tareas pendientes */
    #contador {
      margin: 0;
      font-size: 0.95rem;
      font-weight: 600;
      color: #6b7280;
    }

    /* Botón para abrir la ventana flotante de orden */
    #botonAbrirOrden {
      padding: 6px 12px;
      font-size: 0.85rem;
      font-weight: 600;
      color: #4f46e5;
      background: #eef2ff;
      border: 1px solid #c7d2fe;
      border-radius: 8px;
      cursor: pointer;
      transition: background-color 0.2s ease, transform 0.15s ease, box-shadow 0.2s ease;
    }

    #botonAbrirOrden:hover {
      background: #e0e7ff;
      transform: translateY(-1px);
      box-shadow: 0 3px 8px rgba(79, 70, 229, 0.2);
    }

    #botonAbrirOrden:active {
      transform: translateY(0);
    }

    /* Lista sin viñetas */
    #listaTareas {
      list-style: none;
      margin: 0;
      padding: 0;
    }

    #listaTareas li {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 14px;
      margin-bottom: 10px;
      background: #f9fafb;
      border: 1px solid #e5e7eb;
      border-radius: 10px;
    }

    /* Estilo para el mensaje "No hay resultados" */
    #listaTareas li.sin-resultados {
      justify-content: center;
      color: #6b7280;
      font-weight: 600;
      font-style: italic;
      background: #f3f4f6;
    }

    /* Contenedor para el texto y la fecha de cada tarea */
    .contenido-tarea {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .contenido-tarea span {
      word-break: break-word;
      transition: color 0.2s ease;
    }

    /* Estilos de fecha, prioridad y estados (Vencida / Vence hoy) */
    .info-fecha {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 6px;
      font-size: 0.82rem;
      color: #6b7280;
    }

    /* Etiquetas de prioridad */
    .etiqueta-prioridad {
      font-size: 0.75rem;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 999px;
      text-transform: capitalize;
    }

    .prioridad-alta {
      color: #b91c1c;
      background: #fee2e2;
    }

    .prioridad-media {
      color: #b45309;
      background: #fef3c7;
    }

    .prioridad-baja {
      color: #1d4ed8;
      background: #dbeafe;
    }

    .etiqueta-vencida {
      color: #dc2626;
      background: #fee2e2;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 999px;
    }

    .texto-vencida {
      color: #dc2626;
      font-weight: 600;
    }

    .etiqueta-hoy {
      color: #c2410c;
      background: #ffedd5;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 999px;
    }

    #listaTareas input[type="checkbox"] {
      width: 18px;
      height: 18px;
      cursor: pointer;
      accent-color: #4f46e5;
    }

    /* Tareas completadas: tachadas y en gris */
    .completada {
      text-decoration: line-through;
      color: #9ca3af;
    }

    /* Botón Borrar (separado del texto con más espacio) */
    #listaTareas li button {
      margin-left: 6px;
      padding: 6px 14px;
      font-size: 0.9rem;
      font-weight: 600;
      color: #ffffff;
      background: #ef4444;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      transition: background-color 0.25s ease, transform 0.15s ease, box-shadow 0.25s ease;
    }

    #listaTareas li button:hover {
      background: #dc2626;
      transform: translateY(-2px);
      box-shadow: 0 4px 10px rgba(239, 68, 68, 0.35);
    }

    #listaTareas li button:active {
      transform: translateY(0);
    }

    /* Casilla para editar una tarea directamente en la lista */
    #listaTareas li input[type="text"],
    #listaTareas li input[type="date"],
    #listaTareas li select {
      width: 100%;
      box-sizing: border-box;
      padding: 7px 10px;
      font-size: 0.95rem;
      font-family: inherit;
      border: 2px solid #e5e7eb;
      border-radius: 6px;
      outline: none;
      background: #ffffff;
    }

    #listaTareas li input[type="text"]:focus,
    #listaTareas li input[type="date"]:focus,
    #listaTareas li select:focus {
      border-color: #4f46e5;
      box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.15);
    }

    /* Ventana de confirmación y ventana flotante de orden */
    dialog {
      border: none;
      border-radius: 14px;
      padding: 24px;
      max-width: 340px;
      width: calc(100% - 48px);
      text-align: center;
      box-shadow: 0 15px 40px rgba(0, 0, 0, 0.25);
    }

    dialog::backdrop {
      background: rgba(31, 41, 55, 0.55);
    }

    dialog p {
      margin: 0 0 20px;
      font-size: 1.05rem;
      font-weight: 600;
    }

    dialog button {
      padding: 8px 18px;
      margin: 0 4px;
      font-size: 0.95rem;
      font-weight: 600;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background-color 0.25s ease, transform 0.15s ease, box-shadow 0.25s ease;
    }

    dialog button:hover {
      transform: translateY(-2px);
    }

    dialog button:active {
      transform: translateY(0);
    }

    #botonConfirmar {
      color: #ffffff;
      background: #ef4444;
    }

    #botonConfirmar:hover {
      background: #dc2626;
      box-shadow: 0 4px 10px rgba(239, 68, 68, 0.35);
    }

    #botonCancelar,
    #botonCancelarOrden {
      color: #374151;
      background: #e5e7eb;
    }

    #botonCancelar:hover,
    #botonCancelarOrden:hover {
      background: #d1d5db;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.12);
    }

    /* Estilos de la ventana flotante de ordenamiento */
    #ventanaOrdenar h2 {
      margin: 0 0 16px;
      font-size: 1.2rem;
      font-weight: 700;
      color: #1f2937;
    }

    .opciones-orden {
      display: flex;
      flex-direction: column;
      gap: 10px;
      text-align: left;
      margin-bottom: 20px;
    }

    .opcion-orden {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 12px;
      background: #f9fafb;
      border: 2px solid #e5e7eb;
      border-radius: 10px;
      cursor: pointer;
      font-size: 0.95rem;
      font-weight: 600;
      color: #374151;
      transition: border-color 0.2s ease, background-color 0.2s ease;
    }

    .opcion-orden:hover {
      background: #eef2ff;
      border-color: #c7d2fe;
    }

    .opcion-orden input[type="radio"] {
      width: 17px;
      height: 17px;
      accent-color: #4f46e5;
      cursor: pointer;
    }

    .acciones-orden {
      display: flex;
      justify-content: center;
      gap: 8px;
    }

    #botonAplicarOrden {
      color: #ffffff;
      background: #4f46e5;
    }

    #botonAplicarOrden:hover {
      background: #4338ca;
      box-shadow: 0 4px 10px rgba(79, 70, 229, 0.35);
    }

    /* =====================================================
       MODO OSCURO
       Todo lo de abajo solo se aplica cuando el body
       tiene la clase "oscuro". El modo claro no cambia.
       ===================================================== */

    /* Fondo y texto principal */
    body.oscuro {
      background: linear-gradient(135deg, #111827 0%, #1e1b4b 100%);
      color: #f3f4f6;
      color-scheme: dark; /* calendario y barras de desplazamiento en oscuro */
    }

    body.oscuro .contenedor {
      background: #1f2937;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.45);
    }

    /* Título con color de acento */
    body.oscuro h1 {
      background: none;
      -webkit-text-fill-color: #818cf8;
      color: #818cf8;
    }

    /* Botón de tema */
    body.oscuro #botonTema {
      background: #374151;
      border-color: #4b5563;
    }

    body.oscuro #botonTema:hover {
      background: #4b5563;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.4);
    }

    /* Campos de texto, fecha, prioridad y búsqueda */
    body.oscuro #campoTarea,
    body.oscuro #campoFecha,
    body.oscuro #campoPrioridad,
    body.oscuro #campoBuscar,
    body.oscuro #listaTareas li input[type="text"],
    body.oscuro #listaTareas li input[type="date"],
    body.oscuro #listaTareas li select {
      background: #111827;
      color: #f3f4f6;
      border-color: #4b5563;
    }

    body.oscuro #campoTarea:focus,
    body.oscuro #campoFecha:focus,
    body.oscuro #campoPrioridad:focus,
    body.oscuro #campoBuscar:focus,
    body.oscuro #listaTareas li input[type="text"]:focus,
    body.oscuro #listaTareas li input[type="date"]:focus,
    body.oscuro #listaTareas li select:focus {
      border-color: #818cf8;
      box-shadow: 0 0 0 3px rgba(129, 140, 248, 0.25);
    }

    body.oscuro input::placeholder {
      color: #9ca3af;
    }

    /* Botón Agregar (acento) */
    body.oscuro #botonAgregar {
      background: #818cf8;
      color: #111827; /* texto oscuro para buen contraste sobre el acento */
    }

    body.oscuro #botonAgregar:hover {
      background: #a5b4fc;
      box-shadow: 0 4px 10px rgba(129, 140, 248, 0.35);
    }

    /* Botón Limpiar */
    body.oscuro #botonLimpiar {
      background: #374151;
      color: #f3f4f6;
    }

    body.oscuro #botonLimpiar:hover {
      background: #4b5563;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.4);
    }

    /* Filtros */
    body.oscuro .filtros button {
      background: #374151;
      color: #f3f4f6;
    }

    body.oscuro .filtros button:hover {
      background: #4b5563;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.4);
    }

    body.oscuro .filtros button.activo {
      background: #818cf8;
      color: #111827;
      box-shadow: 0 4px 10px rgba(129, 140, 248, 0.35);
    }

    body.oscuro .filtros button.activo:hover {
      background: #a5b4fc;
    }

    /* Contador y botón de ordenar */
    body.oscuro #contador {
      color: #9ca3af;
    }

    body.oscuro #botonAbrirOrden {
      background: #374151;
      color: #f3f4f6;
      border-color: #4b5563;
    }

    body.oscuro #botonAbrirOrden:hover {
      background: #4b5563;
      box-shadow: 0 3px 8px rgba(0, 0, 0, 0.4);
    }

    /* Filas de tareas */
    body.oscuro #listaTareas li {
      background: #374151;
      border-color: #4b5563;
    }

    body.oscuro #listaTareas li.sin-resultados {
      background: #1f2937;
      color: #9ca3af;
    }

    body.oscuro #listaTareas input[type="checkbox"] {
      accent-color: #818cf8;
    }

    body.oscuro .info-fecha {
      color: #9ca3af;
    }

    body.oscuro .completada {
      color: #9ca3af;
    }

    /* Etiquetas de prioridad */
    body.oscuro .prioridad-alta {
      color: #fca5a5;
      background: rgba(239, 68, 68, 0.2);
    }

    body.oscuro .prioridad-media {
      color: #fcd34d;
      background: rgba(245, 158, 11, 0.2);
    }

    body.oscuro .prioridad-baja {
      color: #93c5fd;
      background: rgba(59, 130, 246, 0.2);
    }

    /* Vencida y Vence hoy */
    body.oscuro .etiqueta-vencida {
      color: #fca5a5;
      background: rgba(239, 68, 68, 0.2);
    }

    body.oscuro .texto-vencida {
      color: #f87171;
    }

    body.oscuro .etiqueta-hoy {
      color: #fdba74;
      background: rgba(249, 115, 22, 0.2);
    }

    /* Ventanas flotantes (confirmar y ordenar) */
    body.oscuro dialog {
      background: #1f2937;
      color: #f3f4f6;
      border: 1px solid #4b5563;
    }

    body.oscuro #botonCancelar,
    body.oscuro #botonCancelarOrden {
      background: #374151;
      color: #f3f4f6;
    }

    body.oscuro #botonCancelar:hover,
    body.oscuro #botonCancelarOrden:hover {
      background: #4b5563;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.4);
    }

    body.oscuro #ventanaOrdenar h2 {
      color: #f3f4f6;
    }

    body.oscuro .opcion-orden {
      background: #374151;
      border-color: #4b5563;
      color: #f3f4f6;
    }

    body.oscuro .opcion-orden:hover {
      background: #4b5563;
      border-color: #818cf8;
    }

    body.oscuro .opcion-orden input[type="radio"] {
      accent-color: #818cf8;
    }

    body.oscuro #botonAplicarOrden {
      background: #818cf8;
      color: #111827;
    }

    body.oscuro #botonAplicarOrden:hover {
      background: #a5b4fc;
      box-shadow: 0 4px 10px rgba(129, 140, 248, 0.35);
    }
  </style>
</head>
<body>

  <div class="contenedor">

    <!-- Botón para cambiar de tema (claro/oscuro) -->
    <div class="barra-tema">
      <button id="botonTema" type="button" title="Cambiar tema" aria-label="Cambiar tema">🌙</button>
    </div>

    <!-- ESTRUCTURA: lo que se ve en la página -->
    <h1>Mi lista de tareas</h1>

    <div class="fila-agregar">
      <input type="text" id="campoTarea" placeholder="Escribe una tarea">
      <!-- Selector de fecha opcional -->
      <input type="date" id="campoFecha" title="Fecha límite (opcional)">
      <!-- Selector de prioridad -->
      <select id="campoPrioridad" title="Prioridad de la tarea">
        <option value="alta">Prioridad: Alta</option>
        <option value="media" selected>Prioridad: Media</option>
        <option value="baja">Prioridad: Baja</option>
      </select>
      <button id="botonAgregar">Agregar</button>
    </div>

    <!-- Sección de Buscar tarea (encima de los botones de filtro) -->
    <div class="fila-buscar">
      <input type="text" id="campoBuscar" placeholder="Buscar tarea...">
      <button id="botonLimpiar">Limpiar</button>
    </div>

    <!-- Filtros: deciden qué tareas se muestran -->
    <div class="filtros">
      <button id="filtroTodas" data-filtro="todas" class="activo">Todas</button>
      <button id="filtroPendientes" data-filtro="pendientes">Pendientes</button>
      <button id="filtroCompletadas" data-filtro="completadas">Completadas</button>
    </div>

    <!-- Barra con contador de pendientes y botón de organizar -->
    <div class="barra-estado">
      <p id="contador"></p>
      <!-- Botón para abrir la ventana flotante de orden -->
      <button id="botonAbrirOrden" type="button">Ordenar: Antigüedad</button>
    </div>

    <ul id="listaTareas"></ul>

  </div>

  <!-- Ventana de confirmación: está oculta hasta que se necesita -->
  <dialog id="ventanaConfirmar">
    <p>Confirma borrar tarea no completada?</p>
    <button id="botonConfirmar">Confirmar</button>
    <button id="botonCancelar">Cancelar</button>
  </dialog>

  <!-- Ventana flotante para organizar tareas -->
  <dialog id="ventanaOrdenar">
    <h2>Organizar tareas por</h2>
    <div class="opciones-orden">
      <label class="opcion-orden">
        <input type="radio" name="criterioOrden" value="antiguedad" checked>
        <span>Antigüedad (más antiguas primero)</span>
      </label>
      <label class="opcion-orden">
        <input type="radio" name="criterioOrden" value="recientes">
        <span>Más recientes primero</span>
      </label>
      <label class="opcion-orden">
        <input type="radio" name="criterioOrden" value="prioridad">
        <span>Prioridad (Alta → Media → Baja)</span>
      </label>
    </div>
    <div class="acciones-orden">
      <button id="botonAplicarOrden" type="button">Aplicar</button>
      <button id="botonCancelarOrden" type="button">Cancelar</button>
    </div>
  </dialog>

  <script>
    // Obtener la fecha de hoy en formato "AAAA-MM-DD" (hora local)
    function obtenerFechaHoy() {
      const ahora = new Date();
      const anio = ahora.getFullYear();
      const mes = String(ahora.getMonth() + 1).padStart(2, "0");
      const dia = String(ahora.getDate()).padStart(2, "0");
      return anio + "-" + mes + "-" + dia;
    }

    // Convertir "AAAA-MM-DD" a "DD/MM/AAAA" (día/mes/año)
    function formatearFecha(fechaISO) {
      if (!fechaISO) {
        return "";
      }
      const partes = fechaISO.split("-");
      return partes[2] + "/" + partes[1] + "/" + partes[0];
    }

    // 1. Conectar el código con los elementos de la página
    const campoTarea = document.getElementById("campoTarea");
    const campoFecha = document.getElementById("campoFecha");
    campoFecha.min = obtenerFechaHoy();
    const campoPrioridad = document.getElementById("campoPrioridad");
    const botonAgregar = document.getElementById("botonAgregar");
    const campoBuscar = document.getElementById("campoBuscar");
    const botonLimpiar = document.getElementById("botonLimpiar");
    const listaTareas = document.getElementById("listaTareas");
    const ventanaConfirmar = document.getElementById("ventanaConfirmar");
    const botonConfirmar = document.getElementById("botonConfirmar");
    const botonCancelar = document.getElementById("botonCancelar");
    const contador = document.getElementById("contador");
    const botonesFiltro = document.querySelectorAll(".filtros button");

    // Elementos de la ventana flotante de ordenamiento
    const botonAbrirOrden = document.getElementById("botonAbrirOrden");
    const ventanaOrdenar = document.getElementById("ventanaOrdenar");
    const botonAplicarOrden = document.getElementById("botonAplicarOrden");
    const botonCancelarOrden = document.getElementById("botonCancelarOrden");

    // 2. GUARDADO: nombre del "cajón" del navegador donde guardamos las tareas
    const CLAVE = "lista-de-tareas";

    // Cargar las tareas guardadas (si no hay nada guardado, empezamos con una lista vacía)
    function cargarTareas() {
      try {
        const textoGuardado = localStorage.getItem(CLAVE);
        if (textoGuardado) {
          const datos = JSON.parse(textoGuardado); // convierte el texto en lista
          if (Array.isArray(datos)) {
            return datos;
          }
        }
      } catch (error) {
        // Si algo falla (datos dañados o navegador sin permiso), empezamos de cero
      }
      return [];
    }

    // Guardar la lista actual en el navegador
    function guardarTareas() {
      try {
        localStorage.setItem(CLAVE, JSON.stringify(tareas)); // convierte la lista en texto
      } catch (error) {
        // Si no se puede guardar, la app sigue funcionando, pero sin guardado
      }
    }

    // 3. La lista de tareas vive aquí, en memoria.
    //    Cada tarea es un objeto: { id: 123, texto: "Comprar pan", fecha: "2026-11-20", prioridad: "media", completada: false }
    let tareas = cargarTareas();

    // Recuerda qué tarea se quiere borrar mientras la ventana está abierta
    let tareaPendienteId = null;

    // Filtro activo: "todas", "pendientes" o "completadas".
    // No se guarda: al recargar la página vuelve a "todas".
    let filtroActual = "todas";

    // Criterio de orden activo: "antiguedad", "recientes" o "prioridad"
    let ordenActual = "antiguedad";

    // Texto actual de búsqueda (en minúsculas)
    let textoBusqueda = "";

    // Lista aparte, solo para mostrar. La lista original "tareas" nunca se modifica al filtrar, buscar u ordenar.
    let tareasVisibles = [];

    // Peso numérico de cada prioridad para ordenar (Alta = 1, Media = 2, Baja = 3)
    const PESO_PRIORIDAD = {
      alta: 1,
      media: 2,
      baja: 3
    };

    // ===== TEMA (claro / oscuro) =====
    // Clave distinta a la de las tareas, para no mezclar los datos
    const CLAVE_TEMA = "tema-app";
    const botonTema = document.getElementById("botonTema");

    // Leer el tema guardado. Si no hay nada (o es inválido), usamos "claro"
    function cargarTema() {
      try {
        const guardado = localStorage.getItem(CLAVE_TEMA);
        if (guardado === "claro" || guardado === "oscuro") {
          return guardado;
        }
      } catch (error) {
        // Si el navegador no permite leer, usamos el tema claro
      }
      return "claro";
    }

    // Guardar el tema actual
    function guardarTema() {
      try {
        localStorage.setItem(CLAVE_TEMA, tema);
      } catch (error) {
        // Si no se puede guardar, el cambio de tema igual funciona
      }
    }

    // Estado: "claro" u "oscuro"
    let tema = cargarTema();

    // Aplicar el tema a la página: pone o quita la clase "oscuro" y cambia el icono
    function aplicarTema() {
      const esOscuro = tema === "oscuro";
      document.body.classList.toggle("oscuro", esOscuro);
      botonTema.textContent = esOscuro ? "☀️" : "🌙";
      botonTema.title = esOscuro ? "Cambiar a modo claro" : "Cambiar a modo oscuro";
      botonTema.setAttribute("aria-label", botonTema.title);
    }

    // Al hacer clic: alternar entre claro y oscuro, guardar y aplicar
    botonTema.addEventListener("click", function () {
      tema = tema === "claro" ? "oscuro" : "claro";
      guardarTema();
      aplicarTema();
    });

    // Aplicar el tema guardado al abrir la página
    aplicarTema();

    // Actualizar el contador de tareas pendientes (siempre cuenta sobre la lista original)
    function actualizarContador() {
      const pendientes = tareas.filter(function (tarea) {
        return !tarea.completada;
      }).length;

      contador.textContent = pendientes === 1
        ? "1 tarea pendiente"
        : pendientes + " tareas pendientes";
    }

    // 4. Dibujar en la página las tareas que toca mostrar según el filtro, búsqueda y orden
    function mostrarTareas() {
      listaTareas.innerHTML = ""; // vaciar lo que se veía antes
      const hoy = obtenerFechaHoy();

      // Armar la lista de visibles a partir de una copia filtrada (sin tocar "tareas")
      tareasVisibles = tareas.filter(function (tarea) {
        // 1) Verificar que cumpla con el filtro actual
        let cumpleFiltro = true;
        if (filtroActual === "pendientes") {
          cumpleFiltro = !tarea.completada;
        } else if (filtroActual === "completadas") {
          cumpleFiltro = tarea.completada;
        }

        // 2) Verificar que coincida con la búsqueda (sin distinguir mayúsculas/minúsculas)
        const cumpleBusqueda = tarea.texto.toLowerCase().includes(textoBusqueda);

        return cumpleFiltro && cumpleBusqueda;
      });

      // Ordenar la copia visible según el criterio seleccionado (funciona en Todas, Pendientes y Completadas)
      tareasVisibles.sort(function (a, b) {
        if (ordenActual === "prioridad") {
          const pesoA = PESO_PRIORIDAD[a.prioridad || "media"];
          const pesoB = PESO_PRIORIDAD[b.prioridad || "media"];
          if (pesoA !== pesoB) {
            return pesoA - pesoB;
          }
          // Si tienen la misma prioridad, desempata por antigüedad
          return a.id - b.id;
        }

        if (ordenActual === "recientes") {
          return b.id - a.id;
        }

        // Por defecto: "antiguedad" (más antiguas primero, según el id timestamp)
        return a.id - b.id;
      });

      actualizarContador();

      // Si hay una búsqueda activa y no se encontraron coincidencias, mostrar mensaje
      if (tareasVisibles.length === 0 && textoBusqueda !== "") {
        const mensajeVacio = document.createElement("li");
        mensajeVacio.textContent = "No hay resultados";
        mensajeVacio.classList.add("sin-resultados");
        listaTareas.appendChild(mensajeVacio);
        return;
      }

      tareasVisibles.forEach(function (tarea) {
        const item = document.createElement("li");

        const casilla = document.createElement("input");
        casilla.type = "checkbox";
        casilla.checked = tarea.completada;

        // Contenedor para el texto, prioridad y fecha límite
        const contenido = document.createElement("div");
        contenido.classList.add("contenido-tarea");

        const etiqueta = document.createElement("span");
        etiqueta.textContent = tarea.texto;
        etiqueta.classList.toggle("completada", tarea.completada);

        contenido.appendChild(etiqueta);

        // Fila secundaria de metadatos (prioridad + fecha límite)
        const infoFecha = document.createElement("div");
        infoFecha.classList.add("info-fecha");

        // Etiqueta de prioridad de la tarea
        const prioridadTarea = tarea.prioridad || "media";
        const badgePrioridad = document.createElement("span");
        badgePrioridad.textContent = "Prioridad " + prioridadTarea;
        badgePrioridad.classList.add("etiqueta-prioridad", "prioridad-" + prioridadTarea);
        infoFecha.appendChild(badgePrioridad);

        // Mostrar fecha límite si la tarea tiene una asignada
        if (tarea.fecha) {
          const textoFecha = document.createElement("small");
          textoFecha.textContent = "Límite: " + formatearFecha(tarea.fecha);

          if (tarea.completada) {
            // Una tarea completada nunca se muestra como vencida
            textoFecha.classList.add("completada");
            infoFecha.appendChild(textoFecha);
          } else if (tarea.fecha < hoy) {
            // Tarea vencida (en rojo con el texto "Vencida")
            etiqueta.classList.add("texto-vencida");
            textoFecha.classList.add("texto-vencida");

            const badgeVencida = document.createElement("span");
            badgeVencida.textContent = "Vencida";
            badgeVencida.classList.add("etiqueta-vencida");

            infoFecha.appendChild(textoFecha);
            infoFecha.appendChild(badgeVencida);
          } else if (tarea.fecha === hoy) {
            // Tarea que vence hoy (etiqueta "Vence hoy" en color naranja)
            const badgeHoy = document.createElement("span");
            badgeHoy.textContent = "Vence hoy";
            badgeHoy.classList.add("etiqueta-hoy");

            infoFecha.appendChild(textoFecha);
            infoFecha.appendChild(badgeHoy);
          } else {
            // Fecha futura normal
            infoFecha.appendChild(textoFecha);
          }
        }

        contenido.appendChild(infoFecha);

        const botonBorrar = document.createElement("button");
        botonBorrar.textContent = "Borrar";

        // Botón para editar la tarea
        const botonEditar = document.createElement("button");
        botonEditar.textContent = "Editar";

        // Al presionar "Editar": se muestra una casilla con el texto actual, fecha y prioridad
        botonEditar.addEventListener("click", function () {
          const campoEditar = document.createElement("input");
          campoEditar.type = "text";
          campoEditar.value = tarea.texto;

          const campoEditarFecha = document.createElement("input");
          campoEditarFecha.type = "date";
          campoEditarFecha.value = tarea.fecha || "";
          campoEditarFecha.min = obtenerFechaHoy();

          // Selector para editar prioridad
          const campoEditarPrioridad = document.createElement("select");
          campoEditarPrioridad.innerHTML =
            '<option value="alta">Prioridad: Alta</option>' +
            '<option value="media">Prioridad: Media</option>' +
            '<option value="baja">Prioridad: Baja</option>';
          campoEditarPrioridad.value = tarea.prioridad || "media";

          const botonGuardar = document.createElement("button");
          botonGuardar.textContent = "Guardar";

          contenido.innerHTML = "";
          contenido.appendChild(campoEditar);
          contenido.appendChild(campoEditarFecha);
          contenido.appendChild(campoEditarPrioridad);

          item.replaceChild(botonGuardar, botonEditar);

          campoEditar.focus();

          // Al presionar "Guardar": se actualiza y guarda la tarea
          botonGuardar.addEventListener("click", function () {
            const nuevoTexto = campoEditar.value.trim();
            const nuevaFecha = campoEditarFecha.value;

            if (nuevoTexto === "") {
              return;
            }

            // Se permite conservar la fecha original (aunque ya esté vencida);
            // solo se rechaza una fecha pasada NUEVA
            if (nuevaFecha !== "" && nuevaFecha !== tarea.fecha && nuevaFecha < obtenerFechaHoy()) {
              alert("No puedes elegir una fecha pasada.");
              campoEditarFecha.focus();
              return;
            }

            tarea.texto = nuevoTexto;
            tarea.fecha = nuevaFecha;
            tarea.prioridad = campoEditarPrioridad.value;
            guardarTareas();
            mostrarTareas();
          });
        });

        // Al marcar o desmarcar: se tacha el texto y SE GUARDA
        casilla.addEventListener("change", function () {
          tarea.completada = casilla.checked;
          guardarTareas();
          mostrarTareas(); // redibuja: aplica el filtro, quita estado "Vencida" si se completó y actualiza el contador
        });

        // Al presionar "Borrar":
        //  - completada: se borra directamente
        //  - no completada: se pide confirmación
        botonBorrar.addEventListener("click", function () {
          if (tarea.completada) {
            borrarTarea(tarea.id);
          } else {
            tareaPendienteId = tarea.id;
            ventanaConfirmar.showModal();
          }
        });

        item.appendChild(casilla);
        item.appendChild(contenido);
        item.appendChild(botonEditar);
        item.appendChild(botonBorrar);
        listaTareas.appendChild(item);
      });
    }

    // 5. Agregar una tarea nueva: se suma a la lista, SE GUARDA y se redibuja
    function agregarTarea() {
      const texto = campoTarea.value.trim();
      const fechaSeleccionada = campoFecha.value;

      // Mantener el mínimo de fecha al día de hoy (por si la página lleva días abierta)
      campoFecha.min = obtenerFechaHoy();

      if (texto === "") {
        return;
      }

      if (fechaSeleccionada !== "" && fechaSeleccionada < obtenerFechaHoy()) {
        alert("No puedes elegir una fecha pasada.");
        campoFecha.focus();
        return;
      }

      tareas.push({
        id: Date.now(), // un número único basado en la hora actual
        texto: texto,
        fecha: fechaSeleccionada, // opcional: queda "" si no se eligió fecha
        prioridad: campoPrioridad.value,
        completada: false
      });

      guardarTareas();
      mostrarTareas();

      campoTarea.value = "";
      campoFecha.value = "";
      campoPrioridad.value = "media";
      campoTarea.focus();
    }

    // 6. Borrar una tarea: se quita de la lista, SE GUARDA y se redibuja
    function borrarTarea(id) {
      tareas = tareas.filter(function (tarea) {
        return tarea.id !== id; // nos quedamos con todas menos la borrada
      });

      guardarTareas();
      mostrarTareas();
    }

    // Botón "Confirmar": borra la tarea pendiente y cierra la ventana
    botonConfirmar.addEventListener("click", function () {
      if (tareaPendienteId !== null) {
        borrarTarea(tareaPendienteId);
      }

      ventanaConfirmar.close();
    });

    // Botón "Cancelar": solo cierra la ventana
    botonCancelar.addEventListener("click", function () {
      ventanaConfirmar.close();
    });

    // Al cerrarse la ventana (por cualquier motivo, incluida la tecla Esc),
    // se olvida la tarea pendiente
    ventanaConfirmar.addEventListener("close", function () {
      tareaPendienteId = null;
    });

    // Abrir ventana flotante de organización
    botonAbrirOrden.addEventListener("click", function () {
      // Sincroniza el radio marcado con el orden que está activo actualmente
      const radioActual = ventanaOrdenar.querySelector('input[value="' + ordenActual + '"]');
      if (radioActual) {
        radioActual.checked = true;
      }
      ventanaOrdenar.showModal();
    });

    // Aplicar criterio seleccionado en la ventana flotante
    botonAplicarOrden.addEventListener("click", function () {
      const seleccionado = ventanaOrdenar.querySelector('input[name="criterioOrden"]:checked');
      if (seleccionado) {
        ordenActual = seleccionado.value;

        const etiquetasOrden = {
          antiguedad: "Ordenar: Antigüedad",
          recientes: "Ordenar: Recientes",
          prioridad: "Ordenar: Prioridad"
        };
        botonAbrirOrden.textContent = etiquetasOrden[ordenActual];

        mostrarTareas();
      }
      ventanaOrdenar.close();
    });

    // Cancelar sin aplicar cambios
    botonCancelarOrden.addEventListener("click", function () {
      ventanaOrdenar.close();
    });

    // Botones de filtro: cambian el filtro, resaltan el activo y redibujan
    botonesFiltro.forEach(function (boton) {
      boton.addEventListener("click", function () {
        filtroActual = boton.dataset.filtro;

        botonesFiltro.forEach(function (otro) {
          otro.classList.toggle("activo", otro === boton);
        });

        mostrarTareas();
      });
    });

    // Buscar en tiempo real mientras el usuario escribe
    campoBuscar.addEventListener("input", function () {
      textoBusqueda = campoBuscar.value.trim().toLowerCase();
      mostrarTareas();
    });

    // Botón para limpiar la búsqueda
    botonLimpiar.addEventListener("click", function () {
      campoBuscar.value = "";
      textoBusqueda = "";
      campoBuscar.focus();
      mostrarTareas();
    });

    // Agregar con el botón y con la tecla Enter
    botonAgregar.addEventListener("click", agregarTarea);

    campoTarea.addEventListener("keydown", function (evento) {
      if (evento.key === "Enter") {
        agregarTarea();
      }
    });

    // 7. Al abrir la página, mostrar las tareas que se cargaron
    mostrarTareas();
  </script>

</body>
</html>
